name: Extra CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aot-publish:
    name: Native AOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Install native toolchain
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      # Terp.Hosting.Example is the AOT proof for Terp: ILC reports trim and AOT warnings for the
      # referenced Terp assembly only at publish time. ContinuousIntegrationBuild turns them into errors.
      - name: Publish with Native AOT
        run: dotnet publish src/Terp.Hosting.Example/Terp.Hosting.Example.csproj -c Release -p:ContinuousIntegrationBuild=true
