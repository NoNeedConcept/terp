name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.release-please-manifest.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" uses git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-dotnet@v6

      - name: Build .NET (generates XML docs for API reference)
        run: dotnet build src/Terp.slnx -c Release --verbosity quiet

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build
        env:
          # Set repository variable DOCS_BASE (e.g. /terp/) when not served from a custom domain.
          DOCS_BASE: ${{ vars.DOCS_BASE || '/' }}
          # Set repository variable DOCS_ORIGIN (e.g. https://example.org, no trailing slash, no path)
          # to emit sitemap, canonical links, robots.txt and absolute llms.txt links.
          DOCS_ORIGIN: ${{ vars.DOCS_ORIGIN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
